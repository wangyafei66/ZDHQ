name: 蒙西招租监测 · 每3小时更新

# 防止上一轮没跑完下一轮又启动导致提交冲突
concurrency:
  group: tender-monitor
  cancel-in-progress: false

on:
  schedule:
    # 每 3 小时跑一次（UTC），约合北京时间 8/11/14/17/20/23/2/5 点
    - cron: '0 */3 * * *'
  # 首次推送到 main 时立即跑一次，方便马上看到效果
  push:
    branches: [main]
  # 允许在 GitHub 网页上手动点一次立即运行（调试用）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 缓存依赖与浏览器（避免每小时重复下载 Chromium）
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-deps-${{ hashFiles('requirements.txt') }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装 Chromium（抓 JS 渲染站点必需）
        run: playwright install --with-deps chromium

      - name: 运行监测
        run: python monitor.py --no-push

      - name: 回写看板与去重库
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add -f web/index.html tenders.html tenders.db daily_report.txt
          if git diff --cached --quiet; then
            echo "本次运行无数据变化，跳过提交"
            exit 0
          fi
          git commit -m "自动更新看板 $(date +'%Y-%m-%d %H:%M') [skip ci]"
          # 并发运行时（如连续两次提交触发）可能与另一个任务撞车导致 push 被拒，故重试并先同步远端
          for i in 1 2 3 4 5; do
            if git push origin main; then
              echo "推送成功"
              exit 0
            fi
            echo "推送被拒（第 $i 次），同步远端后重试…"
            git fetch origin main
            git -c core.editor=true rebase origin/main || git rebase --abort
            sleep 5
          done
          echo "多次重试仍失败"
          exit 1

      - name: 发布到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./web
          user_name: "monitor-bot"
          user_email: "monitor-bot@users.noreply.github.com"
          commit_message: "更新看板"
