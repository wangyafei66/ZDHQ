name: 蒙西招租监测 · 每日更新

on:
  schedule:
    # GitHub 的 cron 用 UTC 时间：01:00 UTC = 北京时间 09:00
    - cron: '0 1 * * *'
  # 允许在 GitHub 网页上手动点一次立即运行（调试用）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装 Chromium（抓 JS 渲染站点必需）
        run: playwright install --with-deps chromium

      - name: 运行监测
        run: python monitor.py --no-push

      - name: 回写看板与去重库
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add -f web/index.html tenders.html tenders.db daily_report.txt
          if git diff --cached --quiet; then
            echo "本次运行无数据变化，跳过提交"
          else
            git commit -m "自动更新看板 $(date +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 发布到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./web
          user_name: "monitor-bot"
          user_email: "monitor-bot@users.noreply.github.com"
          commit_message: "更新看板"
