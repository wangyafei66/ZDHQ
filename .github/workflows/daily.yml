name: 蒙西招租监测 · 每小时更新

# 防止上一轮没跑完下一轮又启动导致提交冲突
concurrency:
  group: tender-monitor
  cancel-in-progress: false

on:
  schedule:
    # 每天跑 2 次：北京时间 08:00 和 14:00（UTC 0 点与 6 点）
    - cron: '0 0,6 * * *'
  # 首次推送到 main 时立即跑一次，方便马上看到效果
  push:
    branches: [main]
  # 允许在 GitHub 网页上手动点一次立即运行（调试用）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 缓存依赖与浏览器（避免每小时重复下载 Chromium）
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-deps-${{ hashFiles('requirements.txt') }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装 Chromium（抓 JS 渲染站点必需）
        run: playwright install --with-deps chromium

      - name: 运行监测
        run: python monitor.py --no-push

      - name: 回写看板与去重库
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          # 先同步到远端最新再提交，避免两次运行撞车时 push 被拒
          git fetch origin main
          git reset --soft origin/main
          git add -f web/index.html tenders.html tenders.db daily_report.txt
          if git diff --cached --quiet; then
            echo "本次运行无数据变化，跳过提交"
          else
            git commit -m "自动更新看板 $(date +'%Y-%m-%d %H:%M') [skip ci]"
            git push origin main
          fi

      - name: 发布到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./web
          user_name: "monitor-bot"
          user_email: "monitor-bot@users.noreply.github.com"
          commit_message: "更新看板"
